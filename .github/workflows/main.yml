name: XServer-Game-Renew

on:
  # 由外部定时（cron 面板）通过 workflow_dispatch 触发
  workflow_dispatch:

# 同一时刻只跑一个：避免外部定时重复触发时两次运行同时续期
concurrency:
  group: xserver-game-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    # 主用 + 备用最多跑两轮续期，最坏情况耗时翻倍，放宽到 25 分钟
    timeout-minutes: 25

    steps:
      - name: 📥 拉取本库脚本
        uses: actions/checkout@v4

      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/XServer-Game-Renew-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 复制脚本到工作目录
        run: |
          cp private/xserver_game_renew.py xserver_game_renew.py
          cp private/linktosb.py linktosb.py

      - name: 🐍 安装 Python 依赖
        run: pip install requests --quiet

      - name: 🌐 安装浏览器依赖（patchright + 真 Chrome，Turnstile 过盾用）
        run: |
          pip install patchright --quiet
          # ubuntu-latest 自带 Google Chrome 和 xvfb，有就直接用；缺哪个才补装（省下近 3 分钟）
          google-chrome --version || python -m patchright install --with-deps chrome
          command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; }
          # 日文字体：让失败截图里的日文正常显示，也让浏览器字体环境更接近真实桌面
          sudo apt-get install -y -qq --no-install-recommends fonts-ipafont-gothic || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-ipafont-gothic; }

      - name: 🛡️ 启动 sing-box 代理转发（主用，不可用时自动切备用）
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_URL_BACKUP: ${{ secrets.PROXY_URL_BACKUP }}
        run: |
          if [ -z "$PROXY_URL" ]; then
            echo "ℹ️ 未设置 PROXY_URL，跳过 sing-box 代理启动。"
            exit 0
          fi

          echo "📦 在私库里查找 sing-box 压缩包..."
          SB_ARCHIVE=$(ls private/sing-box-*-linux-amd64.tar.gz 2>/dev/null | head -n1)
          if [ -z "$SB_ARCHIVE" ]; then
            echo "❌ 私库里没找到 sing-box-*-linux-amd64.tar.gz，请检查是否已上传（文件名需匹配这个模式）。"
            exit 1
          fi

          MATCH_COUNT=$(ls private/sing-box-*-linux-amd64.tar.gz 2>/dev/null | wc -l)
          if [ "$MATCH_COUNT" -gt 1 ]; then
            echo "⚠️  私库里有多个 sing-box 压缩包，取到的是: $SB_ARCHIVE"
            echo "⚠️  建议只保留一个版本，避免以后自己也搞混用的是哪个。"
          fi
          echo "📦 使用: $SB_ARCHIVE"

          mkdir -p sb_extract
          tar -xzf "$SB_ARCHIVE" --strip-components=1 -C sb_extract
          cp sb_extract/sing-box ./sing-box
          chmod +x ./sing-box
          ./sing-box version

          # 代理启动函数写成文件，供「执行续期」步骤在主用失败后切换备用时复用
          cat > proxy_lib.sh <<'SH'
          # 用法: start_proxy <线路名> <代理链接>   成功返回 0，失败返回 1
          mask_ip() { sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+/\1.**/g'; }

          start_proxy() {
            local ROLE="$1" URL="$2" PID OUT CURL_STATUS
            pkill -f "sing-box run" >/dev/null 2>&1 || true
            sleep 1

            echo "🔧 [$ROLE] 解析代理链接，生成 sing-box 配置..."
            if ! python3 linktosb.py "$URL" -o singbox.json --port 8080; then
              echo "❌ [$ROLE] 代理链接解析失败，请检查链接格式。"
              return 1
            fi

            echo "🔍 [$ROLE] 检查 sing-box 配置..."
            if ! ./sing-box check -c singbox.json; then
              echo "❌ [$ROLE] sing-box 配置检查失败。"
              return 1
            fi

            echo "🚀 [$ROLE] 启动 sing-box..."
            nohup ./sing-box run -c singbox.json > singbox.log 2>&1 &
            PID=$!
            sleep 3

            if ! kill -0 "$PID" 2>/dev/null; then
              echo "❌ [$ROLE] sing-box 启动后异常退出，日志（已打码 IP）如下："
              tail -n 20 singbox.log | mask_ip
              return 1
            fi

            echo "✅ [$ROLE] sing-box 已启动，测试代理连通性..."
            # 连通性以"非 CF 站点（AWS）"为准，失败再回退 ipify；CF 站点只做信息提示，不影响判定
            if OUT=$(curl -sS -m 12 --proxy http://127.0.0.1:8080 https://checkip.amazonaws.com) \
               || OUT=$(curl -sS -m 12 --proxy http://127.0.0.1:8080 https://api.ipify.org); then
              OUT=$(echo "$OUT" | tr -d '[:space:]')
              if [ -z "$OUT" ]; then
                echo "❌ [$ROLE] 代理连接成功，但出口 IP 接口未返回内容。"
                tail -n 20 singbox.log | mask_ip
                return 1
              fi
              echo "✅ [$ROLE] 出口 IP（非 CF 站点，已脱敏）：$(echo "$OUT" | mask_ip)"

              CF=$(curl -sS -m 10 --proxy http://127.0.0.1:8080 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
              CF_IP=$(echo "$CF" | sed -n 's/^ip=//p' | head -n1 | tr -d '[:space:]')
              CF_LOC=$(echo "$CF" | sed -n 's/^colo=//p;s/^loc=//p' | tr -d '\r' | paste -sd/ -)
              if [ -z "$CF_IP" ]; then
                echo "⚠️ [$ROLE] CF 站点出口 IP 检测失败（仅提示，不影响运行）"
              else
                echo "✅ [$ROLE] 出口 IP（CF 站点，已脱敏）：$(echo "$CF_IP" | mask_ip)（$CF_LOC）"
                if [ "$CF_IP" != "$OUT" ]; then
                  echo "⚠️ [$ROLE] CF 站点与非 CF 站点的出口 IP 不同（节点对两类站点走了不同出口）"
                fi
              fi
              return 0
            else
              CURL_STATUS=$?
              echo "❌ [$ROLE] 代理连通性测试失败，curl exit code: $CURL_STATUS"
              tail -n 20 singbox.log | mask_ip
              return 1
            fi
          }
          SH

          source ./proxy_lib.sh
          ROLE="主用"
          if ! start_proxy "主用" "$PROXY_URL"; then
            if [ -n "$PROXY_URL_BACKUP" ]; then
              echo "⚠️ 主用代理不可用，切换备用代理..."
              if start_proxy "备用" "$PROXY_URL_BACKUP"; then
                ROLE="备用"
              else
                echo "❌ 主用与备用代理均不可用。"
                exit 1
              fi
            else
              echo "❌ 主用代理不可用，且未设置备用代理 PROXY_URL_BACKUP。"
              exit 1
            fi
          fi
          # 记录当前线路，后续步骤和脚本（通知里提示）都会读到
          echo "PROXY_ROLE=$ROLE" >> "$GITHUB_ENV"
          echo "🧭 当前代理线路：$ROLE"

      - name: 🔧 执行续期
        id: renew
        env:
          XSERVER_GAME_ACCOUNT: ${{ secrets.XSERVER_GAME_ACCOUNT }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_URL_BACKUP: ${{ secrets.PROXY_URL_BACKUP }}
          TG_BOT: ${{ secrets.TG_BOT }}
          SINGBOX_LOG_PATH: singbox.log
          # 过盾：xvfb(1920x1080) 下跑有头模式 + 真 Chrome（与参考项目一致）
          TURNSTILE_HEADLESS: "0"
          TURNSTILE_CHANNEL: chrome
          # 可选：浏览器过盾全部失败后的 CapSolver 打码兜底（没设 secret 则自动不启用）
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_KEY }}
        run: |
          run_renew() {
            PROXY_ROLE="$1" xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 -u xserver_game_renew.py
          }

          set +e
          run_renew "$PROXY_ROLE"
          RC=$?

          # 退出码 3 = XServer 站点侧异常（维护/拥堵），换代理没用，不切备用，等下次计划时间再来
          if [ "$RC" -eq 3 ]; then
            echo "🛠 XServer 站点侧异常，不切换备用代理（换线路没用），等外部定时下次再触发。"
          fi

          # 主用线路续期失败 → 切备用代理再试一次（只在设置了备用代理且当前是主用时触发）
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 3 ] && [ -n "$PROXY_URL" ] && [ -n "$PROXY_URL_BACKUP" ] && [ "$PROXY_ROLE" = "主用" ]; then
            echo "⚠️ 主用代理续期失败（exit $RC），切换备用代理再试一次..."
            source ./proxy_lib.sh
            if start_proxy "备用" "$PROXY_URL_BACKUP"; then
              echo "PROXY_ROLE=备用" >> "$GITHUB_ENV"
              run_renew "备用"
              RC=$?
            else
              echo "❌ 备用代理启动失败，保留主用线路的失败结果。"
            fi
          fi
          exit "$RC"

      - name: 📸 上传过盾失败截图（如有）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turnstile-fail-screenshots
          path: turnstile_fail*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: 📨 工作流级失败兜底通知
        if: failure() && steps.renew.outcome != 'failure'
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          if [ -z "$TG_BOT" ]; then
            echo "ℹ️ 未设置 TG_BOT，跳过兜底通知。"
            exit 0
          fi

          CHAT_ID="${TG_BOT%%,*}"
          BOT_TOKEN="${TG_BOT#*,}"
          RUN_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S (北京时间)')
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          MSG=$(printf '%s\n%s\n%s\n%s\n%s' \
            "🎮 XServer Game 续期通知" \
            "🕐 运行时间: ${RUN_TIME}" \
            "🖥 服务器: XServer Game 🇯🇵" \
            "📊 续期结果: ❌ 续期失败！" \
            "📝 原因: 在续期脚本运行之前（如 sing-box 代理启动阶段）就已失败，脚本内部的通知逻辑没机会执行，此为工作流级别兜底通知。详细原因请查看 Actions 日志：${RUN_URL}")

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null || true
